[package]
name = "auto-tuple"
version = "0.2.0"
authors = ["5-6-1 <5-6-1@users.noreply.github.com>"]
description = "Element-wise tuple-ization for traits: auto-generate tuple helper traits and blanket impls"
keywords = ["proc_macro", "tuple", "trait"]
categories = ["development-tools::procedural-macro-helpers"]
license = "MIT"
rust-version = "1.98"
edition = "2024"
repository = "https://github.com/5-6-1/auto-tuple-rs"
documentation = "https://docs.rs/auto-tuple"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1"
syn = { version = "3", features = ["full", "visit", "visit-mut", "parsing", "printing", "clone-impls", "proc-macro"] }

[dev-dependencies]
trybuild = "1"
proptest = "1"

[lints.rust]
# The 1.97+ `linker_messages` lint is deliberately outside the `warnings`
# group; linkers' stdout noise is irrelevant here, so silence it explicitly.
# https://doc.rust-lang.org/rustc/lints/listing/allowed-by-default.html#linker-messages
linker_messages = "allow"
